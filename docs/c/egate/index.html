<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E7C66">
<title>Wardiya Attendance</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230E7C66'/%3E%3Ccircle cx='32' cy='32' r='17' fill='none' stroke='%23fff' stroke-width='5'/%3E%3Cpath d='M24 32l6 6 11-12' fill='none' stroke='%23F4A63A' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>window.WARDIYA_CONFIG = window.WARDIYA_CONFIG || {};</script>
<script src="config.js" onerror="void 0"></script>
<style>
:root{--p:#0E7C66;--p2:#0A6352;--pl:#E6F2EF;--acc:#F4A63A;--ink:#0B1F1A;--mut:#5B6B66;--line:#E3E9E7;--bg:#F5F7F6;--card:#fff;--red:#C2410C;--redl:#FDECE4;--amb:#B45309;--ambl:#FEF3C7;--grn:#047857;--grnl:#D1FAE5;--blu:#1D4ED8;--blul:#DBEAFE;--r:14px;--sh:0 1px 2px rgba(11,31,26,.05),0 4px 16px rgba(11,31,26,.06)}
*{box-sizing:border-box}html,body{margin:0}body{font-family:Inter,"IBM Plex Sans Arabic",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
[dir=rtl] body{font-family:"IBM Plex Sans Arabic",Inter,system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--p)}
.hidden{display:none!important}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:#fff;padding:9px 14px;border-radius:10px;font-weight:600;cursor:pointer;transition:.15s;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:#c9d4d0;background:#fafcfb}.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.pri{background:var(--p);border-color:var(--p);color:#fff}.btn.pri:hover{background:var(--p2)}
.btn.dan{color:var(--red);border-color:#f3c7b5}.btn.dan:hover{background:var(--redl)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}.btn.ghost{border-color:transparent;background:transparent}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}.field label{font-size:13px;font-weight:600;color:var(--mut)}
.inp{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none;transition:.15s}
.inp:focus{border-color:var(--p);box-shadow:0 0 0 3px color-mix(in srgb,var(--p) 18%,transparent)}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>.field{flex:1;min-width:140px}
.hint{font-size:12.5px;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:600;background:#EEF2F1;color:var(--mut);white-space:nowrap}
.pill.g{background:var(--grnl);color:var(--grn)}.pill.r{background:var(--redl);color:var(--red)}.pill.a{background:var(--ambl);color:var(--amb)}.pill.b{background:var(--blul);color:var(--blu)}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:-.02em}
.logo svg{flex:none}
/* login */
#login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.lg-side{background:linear-gradient(150deg,#0B1F1A,var(--p) 78%);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.lg-side:after{content:"";position:absolute;width:420px;height:420px;border-radius:50%;border:60px solid rgba(255,255,255,.05);right:-140px;bottom:-140px}
.lg-side h1{font-size:38px;line-height:1.1;letter-spacing:-.03em;margin:0 0 14px;max-width:460px}
.lg-side p{opacity:.85;max-width:440px;margin:0}
.lg-feats{display:grid;gap:10px;margin-top:28px}.lg-feats div{display:flex;gap:10px;align-items:center;opacity:.92}
.lg-feats i{width:22px;height:22px;border-radius:7px;background:rgba(255,255,255,.14);display:grid;place-items:center;font-style:normal;font-size:12px}
.lg-main{display:flex;align-items:center;justify-content:center;padding:32px}
.lg-box{width:100%;max-width:380px}
.lg-box h2{margin:0 0 4px;font-size:24px;letter-spacing:-.02em}
.demo-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0 6px}
.demo-card{border:1px dashed color-mix(in srgb,var(--p) 35%,#fff);background:var(--pl);border-radius:12px;padding:12px;cursor:pointer;text-align:start}
.demo-card b{display:block;font-size:14px}.demo-card span{font-size:12px;color:var(--mut)}
.demo-card:hover{border-style:solid;border-color:var(--p)}
.welcome{background:var(--pl);border-inline-start:4px solid var(--p);border-radius:10px;padding:12px 14px;margin:-6px 0 18px;font-size:14px;white-space:pre-line}
.err{background:var(--redl);color:var(--red);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:12px}
/* shell */
#shell{min-height:100vh;display:grid;grid-template-columns:240px 1fr}
.side{background:#0B1F1A;color:#cfe0db;padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.side .logo{color:#fff;padding:4px 10px 18px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:0;background:transparent;color:inherit;cursor:pointer;font-weight:500;text-align:start}
.nav button:hover{background:rgba(255,255,255,.06)}.nav button.on{background:color-mix(in srgb,var(--p) 45%,transparent);color:#fff}
.nav svg{width:18px;height:18px;flex:none;opacity:.9}
.side-foot{margin-top:auto;padding:10px;font-size:12px;opacity:.6}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 28px;background:rgba(245,247,246,.9);backdrop-filter:blur(8px);position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line)}
.top h1{font-size:20px;margin:0;letter-spacing:-.02em}
.top .who{display:flex;align-items:center;gap:8px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--p);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
.content{padding:24px 28px 80px;max-width:1240px;width:100%}
.banner{background:#FFF7E6;border-bottom:1px solid #F7DFAE;color:#7A4A00;font-size:13.5px;padding:8px 28px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.mob-nav{display:none}
/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:18px}
.kpi{padding:16px 18px}.kpi .l{font-size:13px;color:var(--mut);font-weight:600}.kpi .v{font-size:30px;font-weight:800;letter-spacing:-.03em;margin-top:4px}.kpi .s{font-size:12.5px;color:var(--mut)}
.grid2{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}
.sec{padding:18px}.sec h3{margin:0 0 14px;font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.bars{display:flex;align-items:flex-end;gap:6px;height:170px;padding-top:10px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.bar .stack{width:100%;max-width:28px;display:flex;flex-direction:column-reverse;border-radius:6px 6px 2px 2px;overflow:hidden;background:#EEF2F1}
.bar .stack i{display:block;background:var(--p)}.bar .stack i.late{background:var(--acc)}
.bar small{font-size:10.5px;color:var(--mut)}.bar.off .stack{opacity:.35}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mut)}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}
.list{display:flex;flex-direction:column}.li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.li:last-child{border-bottom:0}
.li .n{font-weight:600}.li .m{font-size:12.5px;color:var(--mut)}
.empty{color:var(--mut);text-align:center;padding:26px 10px;font-size:14px}
/* tables */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
.toolbar .field{margin:0;min-width:130px}
.tbl-wrap{overflow:auto;border-radius:var(--r)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:start;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);font-weight:700;padding:11px 12px;background:#FAFBFB;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}tbody tr:hover{background:#FAFCFB}
td.num,th.num{text-align:end;font-variant-numeric:tabular-nums}
.muted{color:var(--mut)}.small{font-size:12.5px}
/* clock */
.clock{max-width:560px;margin:0 auto;text-align:center;padding:30px 24px}
.clock .date{color:var(--mut);font-weight:600}
.clock .time{font-size:64px;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums;margin:2px 0 8px}
.big-btn{width:210px;height:210px;border-radius:50%;border:0;cursor:pointer;color:#fff;font-size:22px;font-weight:800;margin:18px auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:transform .12s,box-shadow .2s}
.big-btn small{font-size:13px;font-weight:600;opacity:.85}
.big-btn.in{background:radial-gradient(circle at 30% 25%,color-mix(in srgb,var(--p) 75%,#fff),var(--p));box-shadow:0 12px 40px color-mix(in srgb,var(--p) 35%,transparent),0 0 0 12px color-mix(in srgb,var(--p) 8%,transparent)}
.big-btn.out{background:radial-gradient(circle at 30% 25%,color-mix(in srgb,var(--acc) 75%,#fff),color-mix(in srgb,var(--acc) 85%,#000));box-shadow:0 12px 40px color-mix(in srgb,var(--acc) 35%,transparent),0 0 0 12px color-mix(in srgb,var(--acc) 10%,transparent)}
.big-btn:active{transform:scale(.97)}.big-btn:disabled{opacity:.6}
.loc{font-size:13px;color:var(--mut);display:flex;justify-content:center;gap:6px;align-items:center;flex-wrap:wrap}
.sessions{margin-top:20px;text-align:start}
/* modal & toast */
.overlay{position:fixed;inset:0;background:rgba(11,31,26,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{width:100%;max-width:520px;max-height:92vh;overflow:auto;padding:22px}
.modal h3{margin:0 0 16px;font-size:18px}
.modal .acts{display:flex;justify-content:flex-end;gap:10px;margin-top:8px}
#toasts{position:fixed;bottom:18px;inset-inline-end:18px;display:flex;flex-direction:column;gap:8px;z-index:60}
.toast{background:#0B1F1A;color:#fff;padding:11px 16px;border-radius:10px;box-shadow:var(--sh);font-size:14px;max-width:340px;animation:tin .2s}
.toast.bad{background:var(--red)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
.btn:not(.pri) .spin{border-color:#ccd;border-top-color:var(--p)}
@keyframes sp{to{transform:rotate(360deg)}}
.days{display:flex;gap:6px;flex-wrap:wrap}.days label{display:flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13.5px;background:#fff}
.days input{accent-color:var(--p)}
.branch-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.loading{padding:60px;text-align:center;color:var(--mut)}
@media (max-width:900px){
 #login{grid-template-columns:1fr}.lg-side{padding:28px 24px}.lg-side h1{font-size:28px}.lg-feats{display:none}
 #shell{grid-template-columns:1fr}.side{display:none}
 .mob-nav{display:flex;overflow-x:auto;gap:4px;padding:8px 12px;background:#0B1F1A;position:sticky;top:0;z-index:6;scrollbar-width:none}
 .mob-nav button{flex:none;border:0;background:transparent;color:#cfe0db;padding:8px 12px;border-radius:9px;font-weight:600;font-size:13.5px}
 .mob-nav button.on{background:color-mix(in srgb,var(--p) 55%,transparent);color:#fff}
 .top{padding:12px 16px;top:50px}.content{padding:16px 14px 60px}.banner{padding:8px 16px}
 .grid2{grid-template-columns:1fr}.top .avatar{display:none}.top h1{font-size:17px}.top .btn.sm{padding:6px 8px}.clock .time{font-size:52px}.big-btn{width:180px;height:180px}
 .hide-m{display:none}
}
@media print{.side,.mob-nav,.top .who,.banner,.toolbar .btn,.no-print{display:none!important}#shell{display:block}.content{padding:0}.card{box-shadow:none}}
</style>

<body>
<div id="app"><div class="loading">Loading…</div></div>
<div id="toasts"></div>
<script>
/*
 * Wardiya Attendance — shared business logic.
 * The SAME file runs in the browser (demo mode) and in Google Apps Script (live mode, as Core.gs).
 * It never touches storage directly: an "env" object provides storage, clock and random IDs.
 */
var WardiyaCore = (function () {
  'use strict';

  var VERSION = '1.1.0';
  var SESSION_TTL_SEC = 12 * 3600;
  var MAX_FAILS = 5;
  var LOCK_SEC = 15 * 60;
  var OPEN_RECORD_MAX_HOURS = 20;

  // ---------- SHA-256 (pure JS, synchronous, public-domain algorithm) ----------
  function sha256(str) {
    var ascii = unescape(encodeURIComponent(String(str)));
    function rr(v, a) { return (v >>> a) | (v << (32 - a)); }
    var maxWord = Math.pow(2, 32), i, j, result = '';
    var words = [], bitLen = ascii.length * 8;
    var hash = [], k = [], primeCounter = 0, isComposite = {};
    for (var c = 2; primeCounter < 64; c++) {
      if (!isComposite[c]) {
        for (i = 0; i < 313; i += c) isComposite[i] = c;
        hash[primeCounter] = (Math.pow(c, 0.5) * maxWord) | 0;
        k[primeCounter++] = (Math.pow(c, 1 / 3) * maxWord) | 0;
      }
    }
    hash = hash.slice(0, 8);
    ascii += '\x80';
    while (ascii.length % 64 - 56) ascii += '\x00';
    for (i = 0; i < ascii.length; i++) {
      j = ascii.charCodeAt(i);
      words[i >> 2] |= j << ((3 - i) % 4) * 8;
    }
    words[words.length] = ((bitLen / maxWord) | 0);
    words[words.length] = bitLen;
    for (j = 0; j < words.length;) {
      var w = words.slice(j, j += 16), old = hash;
      hash = hash.slice(0, 8);
      for (i = 0; i < 64; i++) {
        var w15 = w[i - 15], w2 = w[i - 2], a = hash[0], e = hash[4];
        var t1 = hash[7] + (rr(e, 6) ^ rr(e, 11) ^ rr(e, 25)) + ((e & hash[5]) ^ ((~e) & hash[6])) + k[i] +
          (w[i] = (i < 16) ? w[i] : (w[i - 16] + (rr(w15, 7) ^ rr(w15, 18) ^ (w15 >>> 3)) + w[i - 7] +
            (rr(w2, 17) ^ rr(w2, 19) ^ (w2 >>> 10))) | 0);
        var t2 = (rr(a, 2) ^ rr(a, 13) ^ rr(a, 22)) + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
        hash = [(t1 + t2) | 0].concat(hash);
        hash[4] = (hash[4] + t1) | 0;
      }
      for (i = 0; i < 8; i++) hash[i] = (hash[i] + old[i]) | 0;
    }
    for (i = 0; i < 8; i++) for (j = 3; j + 1; j--) {
      var b = (hash[i] >> (j * 8)) & 255;
      result += ((b < 16) ? '0' : '') + b.toString(16);
    }
    return result;
  }

  function hashPin(pin, salt) {
    var h = sha256(salt + ':' + pin);
    for (var i = 0; i < 300; i++) h = sha256(h + salt);
    return h;
  }

  // ---------- helpers ----------
  function AppError(code, message, extra) { this.code = code; this.message = message || code; this.extra = extra || null; }
  function fail(code, message, extra) { throw new AppError(code, message, extra); }
  function str(v) { return v === null || v === undefined ? '' : String(v).trim(); }
  function num(v) { var n = Number(v); return isFinite(n) ? n : NaN; }
  function bool(v) { return v === true || v === 'true' || v === 1 || v === '1' || v === 'TRUE'; }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function isTime(s) { return /^([01]\d|2[0-3]):[0-5]\d$/.test(s); }
  // Accepts "9:00", "09:00", "09:00:00" (as typed in a sheet) and returns "09:00", or '' if not a time.
  function normTime(v) {
    var m = /^\s*(\d{1,2}):(\d{2})(?::\d{2})?\s*$/.exec(String(v === null || v === undefined ? '' : v));
    if (!m || Number(m[1]) > 23 || Number(m[2]) > 59) return '';
    return pad(Number(m[1])) + ':' + m[2];
  }
  function isDate(s) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
    var p = s.split('-').map(Number), d = new Date(Date.UTC(p[0], p[1] - 1, p[2]));
    return d.getUTCFullYear() === p[0] && d.getUTCMonth() === p[1] - 1 && d.getUTCDate() === p[2];
  }
  function toMin(t) { if (!t) return null; var p = String(t).split(':'); return Number(p[0]) * 60 + Number(p[1]); }
  function fromMin(m) { m = ((Math.round(m) % 1440) + 1440) % 1440; return pad(Math.floor(m / 60)) + ':' + pad(m % 60); }
  function addDays(date, n) {
    var p = date.split('-').map(Number), d = new Date(Date.UTC(p[0], p[1] - 1, p[2] + n));
    return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate());
  }
  function weekday(date) { var p = date.split('-').map(Number); return new Date(Date.UTC(p[0], p[1] - 1, p[2])).getUTCDay(); }
  function haversine(lat1, lng1, lat2, lng2) {
    var R = 6371000, toR = Math.PI / 180;
    var dLat = (lat2 - lat1) * toR, dLng = (lng2 - lng1) * toR;
    var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(lat1 * toR) * Math.cos(lat2 * toR) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
    return Math.round(2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
  }
  function clean(text, max) { return str(text).replace(/[\u0000-\u001f<>]/g, '').slice(0, max || 200); }
  // Prevent spreadsheet formula injection when values are written to Google Sheets.
  function safeCell(v) { v = clean(v, 200); return /^[=+\-@]/.test(v) ? "'" + v : v; }

  var DEFAULT_SETTINGS = {
    companyName: 'My Company',
    timezone: 'Asia/Dubai',
    workStart: '09:00',
    workEnd: '17:00',
    graceMinutes: 10,
    workDays: [1, 2, 3, 4, 5],
    geofenceMode: 'flag', // off | flag | block
    earlyLeaveMinutes: 0,       // leaving more than this many minutes before work end counts as "left early"
    earliestCheckInMinutes: 0,  // 0 = check-in allowed any time; e.g. 60 = opens 1 hour before work start
    appName: 'Wardiya',
    brandColor: '#0E7C66',
    accentColor: '#F4A63A',
    logoUrl: '',
    welcomeMessage: '',
    checkInMessage: '',
    lateMessage: '',
    checkOutMessage: '',
    earlyLeaveMessage: ''
  };
  var SETTING_KEYS = Object.keys(DEFAULT_SETTINGS);

  function recordMinutes(r) {
    if (r.type === 'leave' || !r.inTime || !r.outTime) return 0;
    var d = toMin(r.outTime) - toMin(r.inTime);
    if (d < 0) d += 1440; // overnight shift
    return d;
  }

  function publicEmployee(e) {
    return {
      id: e.id, code: e.code, name: e.name, email: e.email || '', phone: e.phone || '',
      department: e.department || '', branchId: e.branchId || '', role: e.role, active: bool(e.active),
      mustChangePin: bool(e.mustChangePin), createdAt: e.createdAt || ''
    };
  }

  // =====================================================================
  function createApp(env) {
    var S = env.store;

    function settings() {
      var s = S.getSettings() || {};
      var out = {};
      for (var k in DEFAULT_SETTINGS) out[k] = (s[k] === undefined || s[k] === null || s[k] === '') ? DEFAULT_SETTINGS[k] : s[k];
      if (typeof out.workDays === 'string') out.workDays = out.workDays.split(',').filter(function (x) { return x !== ''; }).map(Number);
      out.graceMinutes = Number(out.graceMinutes) || 0;
      out.earlyLeaveMinutes = Number(out.earlyLeaveMinutes) || 0;
      out.earliestCheckInMinutes = Number(out.earliestCheckInMinutes) || 0;
      out.workStart = normTime(out.workStart) || DEFAULT_SETTINGS.workStart;
      out.workEnd = normTime(out.workEnd) || DEFAULT_SETTINGS.workEnd;
      if (!/^#[0-9a-fA-F]{6}$/.test(String(out.brandColor))) out.brandColor = DEFAULT_SETTINGS.brandColor;
      if (!/^#[0-9a-fA-F]{6}$/.test(String(out.accentColor))) out.accentColor = DEFAULT_SETTINGS.accentColor;
      if (!/^https:\/\//.test(String(out.logoUrl))) out.logoUrl = '';

function statusPills(r) {

  if (Number(r.earlyMin) > 0) h += '<span class="pill a">' + t('leftEarly') + ' ' + r.earlyMin + t('min') + '</span> ';
  else if (r.inTime) h += '<span class="pill">' + t('onTimeP') + '</span> ';

function boot() {
  if (CONFIG_ERROR) {
    $('#app').innerHTML = '<div style="max-width:560px;margin:80px auto;padding:24px" class="card"><h2 style="margin-top:0">Setup incomplete</h2><p>' + esc(CONFIG_ERROR) + '</p><p class="muted small">This message is shown instead of the app so that no attendance data is lost. See guides/CLIENT_INSTALL.md, step 5.</p></div>';
    return;
  }
  api('info').then(function (r) { if (r && r.ok) applyBrand(r.data); }).then(function () {
    if (!token) return renderLogin();
    return api('me').then(function (res) {
      if (!res.ok) { token = null; store.del(TOKEN_KEY); return renderLogin(); }
      state.user = res.data.user; state.settings = res.data.settings; applyBrand(res.data.settings);
      renderShell(); go(views()[0]);
      if (state.user.mustChangePin) pinModal(true);
    });
  });
}
boot();
})();
</script>
</body>
</html>
